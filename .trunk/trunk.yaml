# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
    - ruby@4.0.5
lint:
  disabled:
    # Cargo owns clippy linting invocation
    - clippy
    - oxlint
    - oxfmt
  enabled:
    - actionlint@1.7.12
    - checkov@3.3.9
    - eslint@10.8.0
    - git-diff-check
    - grype@0.116.1
    - markdownlint@0.49.1
    - osv-scanner@2.4.0
    - pinact@4.1.1
    - prettier@3.9.6
    - rubocop@1.87.0
    - taplo@0.10.0
    - trufflehog@3.96.0
    - yamllint@1.38.0
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
# Trunk's ruby runtime compiles from source with ruby-build. The stand-in next to this
# file has the same interface and fetches a prebuilt jdx/ruby binary instead. Download
# URLs cannot name a repo path, so it is fetched from this repository's default branch.
downloads:
  - name: ruby-build
    downloads:
      - url: https://raw.githubusercontent.com/trunk-io-demo/flaky-tests-demo/main/.trunk/ruby-build.tar.gz
        strip_components: 1
# Puts ruby, gem, and bundle in .trunk/tools, for integrations/rspec.
tools:
  runtimes:
    - ruby
