[package]
name = "junit-gen"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared library for generating deterministic synthetic JUnit reports and upload manifests."

[lib]
name = "junit_gen"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
quick-junit.workspace = true
rand.workspace = true
rand_chacha.workspace = true
serde.workspace = true
serde_json.workspace = true

# The names of the environment variables the uploader reads come from the
# uploader's own source rather than being retyped here. A rename upstream
# becomes a compile error or a lockfile bump, not a silently skipped field.
constants.workspace = true
