name: Generate and upload the synth stories
description: >
  Runs synth/generate and uploads what it wrote, through the same uploader action
  every other folder uses. Attribution is whatever the workflow put in the
  environment.

inputs:
  org-slug:
    description: Trunk org URL slug.
    required: true
  token:
    description: Trunk org API token. Empty on fork pull requests, which skips the upload.
    required: false
    default: ""
  api-address:
    description: Trunk API address. Lets a fork point at a different environment.
    required: false
    default: ""
  test-collection-id:
    description: Collection ID for synth/. Empty skips the upload.
    required: false
    default: ""
  cli-version:
    description: >
      Uploader CLI version, or "latest". Workflows pass
      vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION so a pre-release build can be
      exercised across every folder at once.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: . -> target

    # SYNTH_* comes from the calling job's `env:`, mapped there from repository
    # variables — `vars` is not ambient in a process. Unset is fine: each one is
    # read through a bounded Var that treats blank as "use the default".
    - name: Generate synthetic reports
      shell: bash
      run: |
        set -euo pipefail
        rm -rf synth-out
        echo "::group::synth/generate"
        cargo run --release --quiet -p generate
        echo "::endgroup::"

    - name: Upload results
      uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
      if: always()
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
      with:
        junit-paths: synth-out/*.xml
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
