name: Run the monitors stories
description: >
  Runs every package under monitors/ and uploads its results. Runner-agnostic:
  it takes no variant — these tests do not touch a network, so the same action
  is callable from the scheduled workflow and from pull requests.

inputs:
  org-slug:
    description: Trunk org URL slug.
    required: true
  token:
    description: Trunk org API token. Empty on fork pull requests, which skips the upload.
    required: false
    default: ""
  api-address:
    description: Trunk API address. Lets a fork point at a different environment.
    required: false
    default: ""
  test-collection-id:
    description: Collection ID for monitors/. Empty skips the upload.
    required: false
    default: ""
  cli-version:
    description: >
      Uploader CLI version, or "latest". Workflows pass
      vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION so a pre-release build can be
      exercised across every folder at once.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run vitest stories
      id: vitest
      shell: bash
      continue-on-error: true
      run: pnpm --filter "./monitors/**" --no-bail --if-present run test

    - name: Run playwright stories
      id: playwright
      shell: bash
      continue-on-error: true
      run: pnpm --filter "./monitors/**" --no-bail --if-present run test:e2e

    - name: Upload results
      uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
      if: always()
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
      with:
        junit-paths: monitors/*/test-results/*.xml
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        # The uploader owns this job's exit code. Without this input it exits zero even
        # when it has just reported unquarantined failures, so a red job would be
        # impossible and "not quarantined yet" would look identical to "all clear".
        previous-step-outcome: >-
          ${{ (steps.vitest.outcome == 'failure' || steps.playwright.outcome == 'failure') && 'failure' || 'success' }}
