name: Run the monitors stories
description: >
  Runs every package under monitors/ and uploads its results. Runner-agnostic:
  it reads the variant it is handed rather than deciding one, so the same action
  is callable from the scheduled workflow and from pull requests.

inputs:
  variant:
    description: Variant to tag the upload with. Comes from the calling job's matrix.
    required: true
  org-slug:
    description: Trunk org URL slug.
    required: true
  token:
    description: Trunk org API token. Empty on fork pull requests, which skips the upload.
    required: false
    default: ""
  api-address:
    description: Trunk API address. Lets a fork point at a different environment.
    required: false
    default: ""
  test-collection-id:
    description: Collection ID for monitors/. Empty skips the upload.
    required: false
    default: ""
  cli-version:
    description: Uploader CLI version.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # `continue-on-error` is not available on composite action steps, so the exit
    # code is captured in bash instead. It has to be captured rather than
    # ignored: a failing test here is the demo working, and the run must reach
    # the upload either way.
    #
    # The filter iterates workspace members rather than naming paths, so adding a
    # story needs no edit to this file. An empty match is not an error, which is
    # what lets this action exist before its folder has any packages.
    - name: Run vitest stories
      id: vitest
      shell: bash
      run: |
        set +e
        pnpm --filter "./monitors/**" --no-bail --if-present run test
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then echo "vitest: all stories passed"; else echo "vitest: exited $code — expected, these stories fail on purpose"; fi

    - name: Run playwright stories
      id: playwright
      shell: bash
      run: |
        set +e
        pnpm --filter "./monitors/**" --no-bail --if-present run test:e2e
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then echo "playwright: all stories passed"; else echo "playwright: exited $code — expected, these stories fail on purpose"; fi

    - name: Report what was produced
      id: results
      shell: bash
      run: |
        shopt -s nullglob
        files=(monitors/*/test-results/*.xml)
        echo "count=${#files[@]}" >> "$GITHUB_OUTPUT"
        printf 'produced %d result file(s)\n' "${#files[@]}"
        for file in "${files[@]}"; do echo "  $file"; done

    # A public repo receives pull requests from forks, and those runs have no
    # access to repository secrets. Skipping with a clear line is the correct
    # behavior: a red X on a contributor's pull request because our demo could
    # not upload would be a bug, not a signal.
    - name: Skip the upload, with a reason
      if: ${{ inputs.token == '' || inputs.test-collection-id == '' }}
      shell: bash
      # The token is compared in an expression and never interpolated into the
      # script, so it cannot end up in a process listing or a log.
      env:
        HAS_TOKEN: ${{ inputs.token != '' }}
      run: |
        if [ "$HAS_TOKEN" != "true" ]; then
          echo "::notice title=monitors upload skipped::No Trunk API token in this context. Expected on pull requests from forks."
        else
          echo "::notice title=monitors upload skipped::MONITORS_TEST_COLLECTION is unset. Set it rather than letting results land in the org default."
        fi

    - name: Upload results
      if: ${{ inputs.token != '' && inputs.test-collection-id != '' && steps.results.outputs.count != '0' }}
      uses: trunk-io/analytics-uploader@ee0cebf9c5ca9b75118c788d952a7ce37b300425 # main
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
        # Quarantining is deliberately off. Every failure in this repo is the
        # story, so a quarantined failure is a story that stopped being told —
        # and leaving it off is also what keeps the job's own status meaningful:
        # a red run here means something is actually wrong, not that a demo test
        # failed on purpose. That is what makes this usable as a canary.
        TRUNK_DISABLE_QUARANTINING: "true"
      with:
        junit-paths: monitors/*/test-results/*.xml
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.variant }}
        cli-version: ${{ inputs.cli-version }}
        use-cache: true
