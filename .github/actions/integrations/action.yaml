name: Run the integrations suites
description: >
  Runs every package under integrations/ that has a test script for the given
  mode, and uploads its results. The four modes are four ways the uploader can
  attribute a test to a file; see integrations/README.md.

inputs:
  mode:
    description: >
      One of xunit, xunit-declarations, xcresult, or xcresult-declarations. The
      xcresult modes need Xcode and so only run on a macOS runner. Doubles as
      the upload's variant, which is what keeps the four apart: they run the
      same tests, and attribution is not otherwise part of test identity.
    required: true
  org-slug:
    description: Trunk org URL slug.
    required: true
  token:
    description: Trunk org API token. Empty on fork pull requests, which skips the upload.
    required: false
    default: ""
  api-address:
    description: Trunk API address. Lets a fork point at a different environment.
    required: false
    default: ""
  test-collection-id:
    description: Collection ID for integrations/. Empty skips the upload.
    required: false
    default: ""
  cli-version:
    description: >
      Uploader CLI version, or "latest". Workflows pass
      vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION so a pre-release build can be
      exercised across every folder at once. The declarations modes need a CLI
      newer than 0.15.4, the last release without their flags.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    # Both pinned rather than "latest": the toolchain decides the report format,
    # and a silent major bump would change it under us.
    - name: Set up Swift
      if: startsWith(inputs.mode, 'xunit')
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: 6.1.0

    - name: Set up Xcode
      if: startsWith(inputs.mode, 'xcresult')
      uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
      with:
        xcode-version: "16.4"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Its own step, and deliberately not under continue-on-error: a mode this
    # does not recognise matches no upload step below either, so folded into the
    # step after it a typo would leave the job green having done nothing.
    - name: Resolve the script for this mode
      id: script
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in
          xunit) script=test ;;
          xunit-declarations) script=test:declarations ;;
          xcresult | xcresult-declarations) script=test:xcresult ;;
          *)
            echo "::error::unknown mode $MODE"
            exit 2
            ;;
        esac
        echo "name=$script" >>"$GITHUB_OUTPUT"

    # `--if-present` is what keeps this generic: playwright/ is upload wiring
    # with no suite of its own and is skipped, and a future framework suite is
    # picked up by adding the script for a mode, with no edit here.
    - name: Run integration suites
      id: suites
      shell: bash
      continue-on-error: true
      run: pnpm --filter "./integrations/**" --no-bail --if-present run ${{ steps.script.outputs.name }}

    # SwiftPM inserts the testing library's name before the extension, so the
    # file is swift-swift-testing.xml rather than swift.xml. Glob, don't name.
    - name: Upload results (xunit)
      if: always() && inputs.mode == 'xunit'
      uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
      with:
        junit-paths: integrations/*/test-results/*.xml
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        # The uploader owns this job's exit code. Without this input it exits zero even
        # when it has just reported unquarantined failures, so a red job would be
        # impossible and "not quarantined yet" would look identical to "all clear".
        previous-step-outcome: ${{ steps.suites.outcome }}

    # Via env because the action has no --swift-test-xunit-paths input, and
    # named in full because that flag takes files where junit-paths takes globs.
    #
    # junit-paths names a directory that deliberately does not exist, and is not
    # optional: the CLI requires one of junit-paths, bazel-bep-path, or
    # test-reports even when the swift flag is supplied, so without it the leg
    # dies with "the following required arguments were not provided".
    #
    # It cannot point at the real report either. The two lists are appended
    # rather than reconciled, so naming the report in both bundles every test
    # twice — measured at 6 cases for a 3-case suite — once with the file the
    # language server resolved and once without. Nothing is lost by the fake
    # path: a swift path that does not exist is a hard error of its own, so a
    # missing report still fails the job.
    - name: Upload results (xunit, declared files)
      if: always() && inputs.mode == 'xunit-declarations'
      uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
        TRUNK_SWIFT_TEST_XUNIT_PATHS: integrations/swift/test-results-declarations/swift-swift-testing.xml
      with:
        junit-paths: integrations/swift/uploaded-via-swift-test-xunit-paths-instead/*.xml
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        previous-step-outcome: ${{ steps.suites.outcome }}

    # xcresult-path takes one bundle, not a glob, so these two name the package.
    - name: Upload results (xcresult)
      if: always() && inputs.mode == 'xcresult'
      uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
      with:
        xcresult-path: integrations/swift/test-results-xcresult/SwiftTestingUpload.xcresult
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        previous-step-outcome: ${{ steps.suites.outcome }}

    # A separate step rather than a conditional value on the step above: clap
    # counts an env-supplied value as present whatever it says, so an empty
    # string here would not read as "off" — it would fail to parse as a bool.
    - name: Upload results (xcresult, declared files)
      if: always() && inputs.mode == 'xcresult-declarations'
      uses: trunk-io/analytics-uploader@385f1ccdf345b4532dc4b6c665dd432b702b8e28 # v2.1.2
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
        TRUNK_USE_EXPERIMENTAL_XCRESULT_TEST_LOCATIONS: "true"
      with:
        xcresult-path: integrations/swift/test-results-xcresult/SwiftTestingUpload.xcresult
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        previous-step-outcome: ${{ steps.suites.outcome }}
