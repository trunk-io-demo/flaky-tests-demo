name: Run the integrations suites
description: >
  Placeholder for the deferred integrations/ work. It exists so that landing
  that folder is one `uses:` line in a workflow rather than a restructuring —
  see integrations/README.md. Today it reports that there is nothing to run.

inputs:
  variant:
    description: Variant to tag uploads with. Comes from the calling job's matrix.
    required: true
  org-slug:
    description: Trunk org URL slug.
    required: true
  token:
    description: Trunk org API token.
    required: false
    default: ""
  api-address:
    description: Trunk API address.
    required: false
    default: ""
  test-collection-id:
    description: Collection ID for integrations/.
    required: false
    default: ""
  cli-version:
    description: Uploader CLI version.
    required: false
    default: latest

runs:
  using: composite
  steps:
    # Every input above is declared rather than added later, so that wiring this
    # in does not also change the calling workflow. They are unused on purpose;
    # this step exists to make that visible instead of leaving a silent no-op.
    - name: Report that integrations/ is deferred
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        echo "::notice title=integrations deferred::No suites here yet (variant ${VARIANT:-unset}). See integrations/README.md."
