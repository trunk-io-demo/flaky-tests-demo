name: Run the integrations suites
description: >
  Runs every package under integrations/ that has a test script for the given
  mode, and uploads its results. Four modes are four ways the uploader can
  attribute a test to a file; the fifth, rspec, uploads through the RSpec plugin
  instead of the uploader. See integrations/README.md.

inputs:
  mode:
    description: >
      One of xunit, xunit-declarations, xcresult, xcresult-declarations, or
      rspec. The xcresult modes need Xcode and so only run on a macOS runner.
      Doubles as the upload's variant, which is what keeps the four Swift modes
      apart: they run the same tests, and attribution is not otherwise part of
      test identity.
    required: true
  org-slug:
    description: Trunk org URL slug.
    required: true
  token:
    description: Trunk org API token. Empty on fork pull requests, which skips the upload.
    required: false
    default: ""
  api-address:
    description: Trunk API address. Lets a fork point at a different environment.
    required: false
    default: ""
  test-collection-id:
    description: Collection ID for integrations/. Empty skips the upload.
    required: false
    default: ""
  cli-version:
    description: >
      Uploader CLI version, or "latest". Workflows pass
      vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION so a pre-release build can be
      exercised across every folder at once. The declarations modes need
      0.15.5-beta.2 or later: below that xunit-declarations fails outright and
      xcresult-declarations silently duplicates plain xcresult.
    required: false
    default: latest
  rspec-version:
    description: >
      rspec_trunk_flaky_tests gem version, or "latest" for the newest stable
      release. Workflows pass vars.RSPEC_PRE_RELEASE_TEST_VERSION, the gem's
      counterpart to cli-version. Only the rspec mode reads it.
    required: false
    default: latest

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Set up pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    # Both pinned rather than "latest": the toolchain decides the report format,
    # and a silent major bump would change it under us.
    #
    # Xcode is pinned to the major only, deliberately. The runner image carries
    # a handful of 26.x patches and rotates which, so an exact pin fails the
    # whole leg the day it ages out — as 16.4 did, on an image offering nothing
    # below 26.0. The major is the part that moves the report format anyway.
    - name: Set up Swift
      if: startsWith(inputs.mode, 'xunit')
      uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
      with:
        swift-version: 6.1.0

    - name: Set up Xcode
      if: startsWith(inputs.mode, 'xcresult')
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ^26.0

    # Ruby comes from the trunk.yaml runtime rather than setup-ruby, so CI and a
    # local `trunk tools install` get the same interpreter. The action adds
    # .trunk/tools to PATH relative to the workspace, and pnpm runs each script
    # from its package directory, so the absolute path is added as well.
    - name: Set up Ruby
      if: inputs.mode == 'rspec'
      uses: trunk-io/trunk-action/install@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1
      with:
        tools: ruby

    - name: Put Ruby on PATH
      if: inputs.mode == 'rspec'
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.trunk/tools" >>"$GITHUB_PATH"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Its own step, and deliberately not under continue-on-error: a mode this
    # does not recognise matches no upload step below either, so folded into the
    # step after it a typo would leave the job green having done nothing.
    - name: Resolve the script for this mode
      id: script
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        case "$MODE" in
          xunit)
            script=test
            report='integrations/*/test-results/*.xml'
            ;;
          xunit-declarations)
            script=test:declarations
            report='integrations/*/test-results-declarations/*.xml'
            ;;
          xcresult | xcresult-declarations)
            script=test:xcresult
            report='integrations/swift/test-results-xcresult/SwiftTestingUpload.xcresult'
            ;;
          rspec)
            script=test:rspec
            report=''
            ;;
          *)
            echo "::error::unknown mode $MODE"
            exit 2
            ;;
        esac
        echo "name=$script" >>"$GITHUB_OUTPUT"
        echo "report=$report" >>"$GITHUB_OUTPUT"

    # `--if-present` is what keeps this generic: playwright/ is upload wiring
    # with no suite of its own and is skipped, and a future framework suite is
    # picked up by adding the script for a mode, with no edit here.
    #
    # The TRUNK_* variables are for the RSpec plugin, which uploads from inside
    # the test process and reads nothing else; the Swift suites ignore them. It
    # activates on the two credentials being *set*, not non-empty, so an empty
    # token from a fork has to be unset or the plugin tries to upload with it.
    - name: Run integration suites
      id: suites
      shell: bash
      continue-on-error: true
      env:
        TRUNK_ORG_URL_SLUG: ${{ inputs.org-slug }}
        TRUNK_API_TOKEN: ${{ inputs.token }}
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
        TRUNK_TEST_COLLECTION_ID: ${{ inputs.test-collection-id }}
        TRUNK_VARIANT: ${{ inputs.mode }}
        RSPEC_TRUNK_FLAKY_TESTS_VERSION: ${{ inputs.rspec-version }}
      run: |
        set -o pipefail
        for name in TRUNK_ORG_URL_SLUG TRUNK_API_TOKEN TRUNK_PUBLIC_API_ADDRESS TRUNK_TEST_COLLECTION_ID; do
          [ -n "${!name}" ] || unset "$name"
        done
        [ -n "${TRUNK_API_TOKEN:-}" ] && [ -n "${TRUNK_TEST_COLLECTION_ID:-}" ] || unset TRUNK_API_TOKEN
        pnpm --filter "./integrations/**" --no-bail --if-present run ${{ steps.script.outputs.name }} 2>&1 |
          tee "$RUNNER_TEMP/integrations-suites.log"

    # `allow-missing-junit-files: false` is not the guard it looks like. When the
    # runner writes no report at all the uploader reports its own error and then
    # exits *zero* — "using quarantining exit code" — so the leg uploads nothing
    # and still goes green. That is how a scheme name that matched no scheme
    # passed for a whole run. This step is the one that makes it loud.
    #
    # The RSpec plugin writes no report file: it uploads from inside rspec and
    # says so on stdout, and failing to publish does not change rspec's exit
    # code. So for that mode the check is the plugin's own success line, and
    # only when there were credentials for it to upload with.
    - name: Check the suites produced a report
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        REPORT: ${{ steps.script.outputs.report }}
        HAS_UPLOAD: ${{ inputs.token != '' && inputs.test-collection-id != '' }}
      run: |
        set -uo pipefail
        if [ "$MODE" = rspec ]; then
          if [ "$HAS_UPLOAD" != true ]; then
            echo "::notice::no token or collection ID, so the RSpec plugin was inactive and uploaded nothing"
            exit 0
          fi
          if ! grep -q 'Flaky tests report upload complete' "$RUNNER_TEMP/integrations-suites.log"; then
            echo "::error::mode rspec ran, but the RSpec plugin did not report a completed upload"
            exit 1
          fi
          echo 'the RSpec plugin reported a completed upload'
          exit 0
        fi
        shopt -s nullglob
        # Expand, then test existence: nullglob drops a pattern that matches
        # nothing, but leaves a wildcard-free path alone — and the xcresult
        # mode's report is a literal directory name.
        found=()
        for candidate in $REPORT; do
          [ -e "$candidate" ] && found+=("$candidate")
        done
        if [ ${#found[@]} -eq 0 ]; then
          echo "::error::mode $MODE produced no report matching $REPORT"
          exit 1
        fi
        printf 'found %s\n' "${found[@]}"

    # SwiftPM inserts the testing library's name before the extension, so the
    # file is swift-swift-testing.xml rather than swift.xml. Glob, don't name.
    - name: Upload results (xunit)
      if: always() && inputs.mode == 'xunit'
      uses: trunk-io/analytics-uploader@817e1a2ec58d888825699ee15ea172809bb3f226 # v2.1.3
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
      with:
        junit-paths: integrations/*/test-results/*.xml
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        # The uploader owns this job's exit code. Without this input it exits zero even
        # when it has just reported unquarantined failures, so a red job would be
        # impossible and "not quarantined yet" would look identical to "all clear".
        previous-step-outcome: ${{ steps.suites.outcome }}

    # Via env because the action has no --swift-test-xunit-paths input, and
    # named in full because that flag takes files where junit-paths takes globs.
    # No junit-paths: this is the only report source, which is what makes the
    # CLI resolve each test's file from its declaration rather than leaving the
    # attribution to the post-processor.
    - name: Upload results (xunit, declared files)
      if: always() && inputs.mode == 'xunit-declarations'
      uses: trunk-io/analytics-uploader@817e1a2ec58d888825699ee15ea172809bb3f226 # v2.1.3
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
        TRUNK_SWIFT_TEST_XUNIT_PATHS: integrations/swift/test-results-declarations/swift-swift-testing.xml
      with:
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        previous-step-outcome: ${{ steps.suites.outcome }}

    # xcresult-path takes one bundle, not a glob, so these two name the package.
    - name: Upload results (xcresult)
      if: always() && inputs.mode == 'xcresult'
      uses: trunk-io/analytics-uploader@817e1a2ec58d888825699ee15ea172809bb3f226 # v2.1.3
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
      with:
        xcresult-path: integrations/swift/test-results-xcresult/SwiftTestingUpload.xcresult
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        previous-step-outcome: ${{ steps.suites.outcome }}

    # A separate step rather than a conditional value on the step above: clap
    # counts an env-supplied value as present whatever it says, so an empty
    # string here would not read as "off" — it would fail to parse as a bool.
    - name: Upload results (xcresult, declared files)
      if: always() && inputs.mode == 'xcresult-declarations'
      uses: trunk-io/analytics-uploader@817e1a2ec58d888825699ee15ea172809bb3f226 # v2.1.3
      env:
        TRUNK_PUBLIC_API_ADDRESS: ${{ inputs.api-address }}
        TRUNK_USE_EXPERIMENTAL_XCRESULT_TEST_LOCATIONS: "true"
      with:
        xcresult-path: integrations/swift/test-results-xcresult/SwiftTestingUpload.xcresult
        org-slug: ${{ inputs.org-slug }}
        token: ${{ inputs.token }}
        test-collection-id: ${{ inputs.test-collection-id }}
        variant: ${{ inputs.mode }}
        cli-version: ${{ inputs.cli-version }}
        allow-missing-junit-files: false
        use-cache: true
        previous-step-outcome: ${{ steps.suites.outcome }}

    # The rspec counterpart of previous-step-outcome. The plugin quarantines in
    # process, so rspec's own exit code already means "not quarantined yet"; the
    # suites step only runs under continue-on-error so the check above can run.
    - name: Hand back the rspec outcome
      if: always() && inputs.mode == 'rspec' && steps.suites.outcome == 'failure'
      shell: bash
      run: |
        echo "::error::rspec reported a failure that is not quarantined"
        exit 1
