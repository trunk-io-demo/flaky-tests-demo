name: PR factory

# Its own workflow rather than a job in hourly.yaml: it is the only thing here
# that writes to the repository, it needs a different token, and it has to run on
# its own clock.
#
# :15, ahead of the hourly run at :45. The order matters — the factory merges last
# hour's pull request first, so the head has already advanced by the time the
# scheduled uploads report against it. Reversed, every hour's results would land
# on the previous hour's commit.
on:
  schedule:
    - cron: 15 * * * *
  workflow_dispatch: {}

# Serialised: two factories at once would open two pull requests an hour and race
# each other merging them.
concurrency:
  group: pr-factory
  cancel-in-progress: false

# Read is enough for the workflow token. Every push, merge, and close below is
# authenticated with PR_FACTORY_TOKEN instead — the default token cannot be used
# to open the pull request, because events it creates do not trigger pr.yaml.
permissions:
  contents: read

jobs:
  # Merging is what moves the default branch, and it happens before this hour's
  # pull request is opened rather than after. Every scheduled run used to report
  # the same SHA forever, so cross-upload pass-on-retry pairs all piled onto one
  # commit with hundreds of runs instead of many commits each holding a pair.
  #
  # Two jobs rather than two steps so that `open` checks out the merged head. A
  # single job would commit on top of the pre-merge commit.
  merge:
    name: merge last hour's
    runs-on: ubuntu-latest
    steps:
      # Fails the job rather than skipping. This workflow only ever runs on a
      # schedule or by hand, never on a fork's pull request, so a missing token is
      # not a contributor hitting a wall we chose to tolerate — it is this
      # repository being misconfigured, and the PR-attributed half of the demo
      # silently producing nothing. That is worth a red job.
      - name: Check for the factory token
        env:
          HAS_TOKEN: ${{ secrets.PR_FACTORY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=PR factory cannot run::PR_FACTORY_TOKEN is unset. The default workflow token cannot be used here — events it creates do not trigger pr.yaml, so no pull-request-attributed data would ever appear. See CONTRIBUTING.md."
            exit 1
          fi
          echo "factory token present"

      # Found by the factory's own label rather than by number arithmetic: a
      # skipped or failed run makes numbers lie. Nothing has been opened yet this
      # run, so every match is a previous hour's and there is nothing to exclude.
      #
      # A merge that will not go through is closed instead. A stuck pull request
      # would otherwise be retried every hour forever, and the point is to move the
      # head, not to land any particular heartbeat.
      - name: Merge the previous pull requests
        env:
          GH_TOKEN: ${{ secrets.PR_FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: pr-factory
        run: |
          set -euo pipefail
          stale=$(gh pr list --label "$LABEL" --state open --limit 50 --json number --jq '.[].number')

          if [ -z "$stale" ]; then
            echo "nothing to merge"
            exit 0
          fi

          for number in $stale; do
            echo "merging #$number"
            if gh pr merge "$number" --squash --delete-branch; then
              echo "merged #$number"
            else
              echo "::warning title=PR factory could not merge::#$number would not merge; closing it instead so the next hour is not blocked."
              gh pr close "$number" --delete-branch \
                --comment "Closed rather than merged: the merge did not go through. Its results were already uploaded."
            fi
          done

  open:
    name: open this hour's
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the merged head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}

      # A unique branch per run, so every hour gets its own pull request rather
      # than one long-lived branch being updated. That is the point: one pull
      # request is one PR-attributed upload.
      - name: Name this hour's branch
        id: branch
        run: echo "name=pr-factory/${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      # Overwritten rather than appended to, so the file cannot grow without bound
      # across a merge every hour. Its content does not matter — only that it is
      # self-evidently inert and obviously machine-generated.
      - name: Write the heartbeat
        run: |
          set -euo pipefail
          mkdir -p .github/pr-factory
          cat > .github/pr-factory/heartbeat.txt <<EOF
          Machine-generated by the hourly PR factory. Merged on the next run, never
          read. Its only job is to exist long enough for pr.yaml to upload test
          results attributed to a pull request. See CONTRIBUTING.md.

          run: ${GITHUB_RUN_ID}
          EOF

      # The vendored action rather than git plus `gh pr create`: it owns the
      # commit, the branch, and the pull request in one step. This is what
      # flake-farm uses for the same job.
      - name: Open this hour's pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.PR_FACTORY_TOKEN }}
          branch: ${{ steps.branch.outputs.name }}
          base: ${{ github.ref_name }}
          labels: pr-factory
          author: flaky-tests-demo pr factory <pr-factory@users.noreply.github.com>
          committer: flaky-tests-demo pr factory <pr-factory@users.noreply.github.com>
          commit-message: Machine-generated heartbeat for run ${{ github.run_id }}
          title: "Machine-generated: PR factory heartbeat"
          body: >
            Opened by the hourly PR factory so that `pr.yaml` can upload
            pull-request-attributed test results. It is **merged on the next hourly
            run**, which advances the default branch so that pass-on-retry pairs
            land on many commits rather than one. See `CONTRIBUTING.md`.
