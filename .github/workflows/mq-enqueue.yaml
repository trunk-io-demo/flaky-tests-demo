name: Enqueue for merge

# Every ten minutes rather than once when a pull request opens, because enqueueing
# is not a one-shot. A pull request whose failures are not quarantined yet cannot
# enter the queue, and one the queue evicted for a failing required check has to be
# resubmitted — both are expected here, and this cadence is the only thing that
# retries them.
#
# It merges nothing. pr-factory.yaml still force-merges last hour's pull request at
# :15 before opening this hour's, so the default branch advances on a fixed clock
# whether or not the queue got there first.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Serialised: two runs would comment twice on every open pull request.
concurrency:
  group: mq-enqueue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enqueue:
    name: comment /trunk merge
    runs-on: ubuntu-latest
    steps:
      # Loudly, for the same reason pr-factory.yaml does it: this workflow only runs
      # on a schedule or by hand, so a missing token is this repository being
      # misconfigured rather than a contributor hitting a wall.
      - name: Check for the factory token
        env:
          HAS_TOKEN: ${{ secrets.PR_FACTORY_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error title=Cannot enqueue::PR_FACTORY_TOKEN is unset. The default workflow token would comment as github-actions[bot], which the queue does not accept as a submitter. See CONTRIBUTING.md."
            exit 1
          fi
          echo "factory token present"

      # Selected by the factory's own label, and drafts are skipped. That is what
      # keeps this off dependabot's pull requests (no label) and off the queue's own
      # testing pull requests (drafts) — commenting on the latter would ask the queue
      # to enqueue its own merge candidate.
      #
      # A pull request already in the queue gets commented on again rather than
      # skipped. Reading queue state from here would cost a Trunk API call per run,
      # and resubmitting the ones that fell out is the entire point of the cadence.
      - name: Enqueue every open machine-generated pull request
        env:
          GH_TOKEN: ${{ secrets.PR_FACTORY_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LABEL: pr-factory
        run: |
          set -euo pipefail
          open=$(gh pr list --label "$LABEL" --state open --limit 50 \
            --json number,isDraft --jq '.[] | select(.isDraft == false) | .number')

          if [ -z "$open" ]; then
            echo "no open $LABEL pull requests to enqueue"
            exit 0
          fi

          for number in $open; do
            echo "enqueueing #$number"
            if ! gh pr comment "$number" --body "/trunk merge"; then
              echo "::warning title=Could not enqueue::Commenting on #$number failed; the next run retries it."
            fi
          done
