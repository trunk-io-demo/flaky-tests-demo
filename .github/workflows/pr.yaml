name: Pull request

# monitors/, apps/, and synth/, plus the checks. Each of these uploads genuinely PR-attributed results
# instead of duplicating the hourly run.
on:
  pull_request: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Shadow mode: the filter recommends which of this workflow's jobs the diff
  # actually needs, but nothing acts on the recommendation.
  #
  # No `job-names`, so one call fans out over every job in this workflow. Queue
  # batches reach this workflow as pull requests on `trunk-merge/...` branches,
  # which the service short-circuits to run-everything, so `MQ` needs no case of
  # its own here.
  dynamic-ci-filter:
    name: dynamic CI filter (shadow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: trunk-io/dynamic-ci@main
        with:
          token: ${{ secrets.TRUNK_API_TOKEN }}

  monitors:
    name: monitors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitors
        with:
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.MONITORS_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  # Matrixed here as well as hourly: these call real services, and the platform can
  # change the answer. A pull request that only ever ran on Linux would not tell
  # you a change broke macOS.
  apps:
    name: apps (${{ matrix.variant }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            variant: linux
          - runs-on: macos-latest
            variant: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apps
        with:
          variant: ${{ matrix.variant }}
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.APPS_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  synth:
    name: synth
    runs-on: ubuntu-latest
    env:
      SYNTH_FAILURE_RATE: ${{ vars.SYNTH_FAILURE_RATE }}
      SYNTH_FLAKE_RATE: ${{ vars.SYNTH_FLAKE_RATE }}
      SYNTH_RUNS_PER_TEST: ${{ vars.SYNTH_RUNS_PER_TEST }}
      SYNTH_DURABLE_TEST_COUNT: ${{ vars.SYNTH_DURABLE_TEST_COUNT }}
      SYNTH_CHURN_TEST_COUNT: ${{ vars.SYNTH_CHURN_TEST_COUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/synth
        with:
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.SYNTH_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  # Required job to make sure this repo adheres to its own rules and conventions.
  checks:
    name: lint, typecheck, and the generators' own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - run: pnpm install --frozen-lockfile

      # Linting and formatting go through trunk, which is also what the
      # pre-commit and pre-push hooks run — so a green local commit means a green
      # job here.
      - uses: trunk-io/trunk-action@04ba50e7658c81db7356da96657e6e77f220bfa3 # v1.3.1

      - run: pnpm typecheck

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: . -> target

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

      # With the uploader binary present, the generators' test suite runs their
      # output through the uploader's own `validate` subcommand — which parses it
      # exactly as an upload would, and uploads nothing. That is the check that
      # catches malformed reports, stale timestamps, and future timestamps before
      # they reach the product.
      #
      # The same version the uploads use, or this gate validates against a
      # different parser than the one that will read the results.
      - name: Resolve the uploader for validation
        id: cli
        env:
          CLI_VERSION: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}
        run: |
          set -euo pipefail
          artifact=trunk-analytics-cli-x86_64-unknown-linux.tar.gz
          if [ "$CLI_VERSION" = "latest" ]; then
            url="https://github.com/trunk-io/analytics-cli/releases/latest/download/${artifact}"
          else
            url="https://github.com/trunk-io/analytics-cli/releases/download/${CLI_VERSION}/${artifact}"
          fi

          workdir="$(mktemp -d)"
          echo "resolving the uploader from $url"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$workdir/cli.tar.gz" "$url"
          tar xzf "$workdir/cli.tar.gz" -C "$workdir"
          "$workdir/trunk-analytics-cli" --version
          echo "path=$workdir/trunk-analytics-cli" >> "$GITHUB_OUTPUT"

      - name: Test the generators
        env:
          TRUNK_ANALYTICS_CLI: ${{ steps.cli.outputs.path }}
        run: cargo test
