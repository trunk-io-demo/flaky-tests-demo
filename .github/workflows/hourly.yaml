name: Hourly

# One cadence for every story. There are deliberately no per-folder schedules: a
# single cadence is what keeps the stories comparable, and synth/ volume is tuned
# by its scale variables rather than by running more often.
#
# The PR factory has its own workflow and its own clock, because it writes to the
# repository and has to move the head before these uploads report against it.
# It runs at :15, this at :45.
on:
  schedule:
    - cron: 45 * * * *
  workflow_dispatch: {}

# Two runs of this workflow at once would double-report every story, which reads
# as a run-count anomaly rather than as a scheduling accident.
concurrency:
  group: hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitors:
    name: monitors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/monitors
        with:
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.MONITORS_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  # The only folder that runs a variant.
  #
  # The variant makes the platform part of test identity, so the same test on two
  # platforms is two tests. Without it both legs would merge into one row and a
  # macOS-only failure would read as a test that fails half the time everywhere.
  apps:
    name: apps (${{ matrix.variant }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            variant: linux
          - runs-on: macos-latest
            variant: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/apps
        with:
          variant: ${{ matrix.variant }}
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.APPS_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  # Report shapes rather than platform behavior, so one runner is enough.
  integrations:
    name: integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/integrations
        with:
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.INTEGRATIONS_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  synth:
    name: synth
    runs-on: ubuntu-latest
    env:
      SYNTH_FAILURE_RATE: ${{ vars.SYNTH_FAILURE_RATE }}
      SYNTH_FLAKE_RATE: ${{ vars.SYNTH_FLAKE_RATE }}
      SYNTH_RUNS_PER_TEST: ${{ vars.SYNTH_RUNS_PER_TEST }}
      SYNTH_DURABLE_TEST_COUNT: ${{ vars.SYNTH_DURABLE_TEST_COUNT }}
      SYNTH_CHURN_TEST_COUNT: ${{ vars.SYNTH_CHURN_TEST_COUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/synth
        with:
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.SYNTH_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}

  # A 500-test population failing almost every run at once, which is the shape infra-failure protection exists to catch.
  synth-infra-failure:
    name: synth (infra failure)
    runs-on: ubuntu-latest
    env:
      SYNTH_FAILURE_RATE: 90
      SYNTH_DURABLE_TEST_COUNT: 500
      SYNTH_FLAKE_RATE: ${{ vars.SYNTH_FLAKE_RATE }}
      SYNTH_RUNS_PER_TEST: ${{ vars.SYNTH_RUNS_PER_TEST }}
      SYNTH_CHURN_TEST_COUNT: ${{ vars.SYNTH_CHURN_TEST_COUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/synth
        with:
          org-slug: ${{ vars.TRUNK_ORG_SLUG }}
          token: ${{ secrets.TRUNK_API_TOKEN }}
          api-address: ${{ vars.TRUNK_API_ADDRESS }}
          test-collection-id: ${{ vars.SYNTH_TEST_COLLECTION }}
          cli-version: ${{ vars.ANALYTICS_CLI_PRE_RELEASE_TEST_VERSION || 'latest' }}
