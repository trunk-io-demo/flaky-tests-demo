[workspace]
members = ["synth/*"]
resolver = "2"

# A nested Cargo package that is neither a member nor excluded is a hard error,
# not a warning. If `integrations/` ever gains a Rust suite, add it to `members`
# or to `exclude` in the same commit. See docs/architecture.md.
exclude = []

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = [
  "clock",
  "std",
] }
clap = { version = "4.5", features = ["derive", "env"] }
quick-junit = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
rand_chacha = "0.10"
rand_distr = "0.6"
# rand 0.8 is load-bearing: fake 2.x and rand_distr 0.4 are the versions that accept
# our ChaCha8Rng, and bumping rand changes every drawn value and the pinned hashes.
fake = "5.1"
bounded-integer = { version = "0.6.2", features = ["macro", "serde1", "std"] }

# The uploader's own definitions, used rather than retyped. `constants` is
# dependency-free, so this costs a git fetch and nothing else. The heavier
# crates in that workspace (protobuf, vendored OpenSSL, git bindings) are
# deliberately not pulled in — see synth/harness/src/attribution.rs.
constants = { git = "https://github.com/trunk-io/analytics-cli" }

[profile.release]
opt-level = "s"
strip = true
